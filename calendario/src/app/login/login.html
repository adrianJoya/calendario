<ion-content class="login-page" fullscreen="true">
  <div class="login-wrapper">
    <div class="login-card app-card">
      <div class="login-header">
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Accede con tu correo y contraseña</p>
      </div>

      <div class="login-form">
        <ion-item lines="none" class="app-input">
          <ion-input
            type="email"
            label="Email"
            label-placement="stacked"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="app-input">
          <ion-input
            type="password"
            label="Contraseña"
            label-placement="stacked"
            placeholder="Introduce tu contraseña"
            [(ngModel)]="password">
          </ion-input>
        </ion-item>

        <ion-button expand="block" class="app-button-primary login-button" (click)="onLogin()">
          Entrar
        </ion-button>

        <ion-button expand="block" fill="clear" (click)="onRegister()">
          Crear cuenta
        </ion-button>

        @if (message) {
          <p class="login-message">{{ message }}</p>
        }
      </div>
    </div>
  </div>
</ion-content>
